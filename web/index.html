<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrator — AI Voice Studio</title>
    <meta name="description" content="Local AI voice generation for storytelling, powered by Qwen3-TTS on Apple Silicon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ═══ HEADER ═══ -->
    <header id="header">
        <div class="header-left">
            <span class="logo">🎙️ Narrator</span>
            <span class="tag">Voice Studio</span>
        </div>
        <div class="header-right">
            <div class="status" id="status">
                <span class="dot"></span>
                <span class="label">Connecting…</span>
            </div>
        </div>
    </header>

    <!-- ═══ MAIN ═══ -->
    <div id="main">

        <!-- ── LEFT: Editor ── -->
        <div class="col col-editor">
            <div class="section-bar">
                <span class="section-title">Script</span>
                <div class="script-stats" id="script-stats">0 chunks · 0 words</div>
                <button class="btn btn-ghost btn-xs" id="btn-save">💾 Save</button>
            </div>
            <div class="editor-box">
                <div class="lines" id="lines"></div>
                <textarea id="editor" spellcheck="false"
                    placeholder="Write your narration here…&#10;&#10;Each line = one audio chunk.&#10;Blank lines are separators (ignored).&#10;&#10;Override per line:&#10;[voice:serena] [emotion:Whispered] Text here…"></textarea>
            </div>
            <div class="editor-hint">
                One line = one chunk&ensp;·&ensp;<code>[voice:X]</code>&ensp;<code>[emotion:X]</code> overrides
            </div>
        </div>

        <!-- ── RIGHT: Controls ── -->
        <div class="col col-controls">

            <!-- Voice -->
            <div class="card">
                <div class="card-title">Voice</div>
                <div class="field">
                    <label>Preset</label>
                    <select id="sel-voice"></select>
                </div>
                <div class="field">
                    <label>Speed&ensp;<span id="speed-val">1.0×</span></label>
                    <input type="range" id="rng-speed" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>

            <!-- Ref Voice -->
            <div class="card">
                <div class="card-title">Reference Voice</div>
                <div class="field">
                    <label>Select</label>
                    <div class="ref-row">
                        <select id="sel-ref"></select>
                        <button class="btn btn-xs btn-ghost" id="btn-play-ref" title="Preview">▶</button>
                    </div>
                </div>
                <div class="field">
                    <label>Transcript</label>
                    <textarea id="inp-ref-text" rows="2" placeholder="Exact transcript of the reference audio"></textarea>
                </div>
                <div class="upload-area" id="upload-area">
                    <input type="file" id="inp-upload" accept=".wav,.mp3,.m4a,.flac" hidden>
                    <span>Drop file or <a href="#" id="btn-browse">browse</a></span>
                </div>
            </div>

            <!-- Emotion -->
            <div class="card">
                <div class="card-title">Emotion / Instruct</div>
                <div class="field">
                    <label>Preset</label>
                    <select id="sel-emotion">
                        <option value="">— Custom —</option>
                        <optgroup label="Narration Styles">
                            <option value="Deep, serious, and emotionally controlled. Speak slowly with gravitas and natural pauses. Begin calm and reflective, gradually build tension, express genuine hurt without melodrama, become intense during betrayal scenes, then finish with quiet confidence and emotional resolution.">🎭 Cinematic Narrator (Default)</option>
                            <option value="Warm, intimate, and conversational. Speak as if confiding in a close friend late at night. Natural pace with soft emphasis on emotional words. Gentle but honest.">💬 Intimate Confessional</option>
                            <option value="Cold, detached, and matter-of-fact. Deliver with clinical precision, no emotional coloring. The flatness itself conveys the weight of what happened.">🧊 Cold & Detached</option>
                        </optgroup>
                        <optgroup label="Betrayal & Emotion">
                            <option value="Start calm and trusting, then let disbelief creep in. Build to a moment of stunned silence. Let the hurt land quietly, not loudly. End with a hollow, empty resolve.">💔 Betrayal Discovery</option>
                            <option value="Controlled anger simmering beneath every word. Speak with precision and restraint. Each sentence is measured, deliberate. The quietness is more terrifying than shouting.">🔥 Quiet Rage</option>
                            <option value="Vulnerable, raw, and exposed. Voice slightly unsteady. Pauses where words fail. Genuine emotional weight without melodrama. Let silence carry meaning.">😢 Raw Vulnerability</option>
                            <option value="Bitter and sardonic. Speak with a knowing smile. Every compliment is laced with irony. The humor is a shield against deeper pain.">😏 Bitter Sarcasm</option>
                            <option value="Resigned and exhausted. Speak as if you've already accepted the worst. No energy left for anger. Just a tired, hollow truth.">😶 Numb Resignation</option>
                        </optgroup>
                        <optgroup label="Pacing & Tone">
                            <option value="Slow, deliberate, and suspenseful. Long pauses between key phrases. Build tension with pacing alone. Let the listener lean in.">⏳ Slow Burn Suspense</option>
                            <option value="Urgent and intense. Words come faster as the stakes rise. Breathless at climactic moments. Sharp, punchy delivery.">⚡ Urgent & Intense</option>
                            <option value="Whispered and secretive. Speak as if someone might overhear. Intimate, conspiratorial. Pull the listener into a private confession.">🤫 Whispered Secret</option>
                            <option value="Nostalgic and wistful. Speak as if recalling a distant memory. Bittersweet warmth mixed with longing. Gentle, slightly faded.">🌅 Nostalgic Flashback</option>
                            <option value="Authoritative and confident. Speak with the certainty of someone who has survived. Strong, grounded, and empowered. The voice of hard-won wisdom.">👑 Empowered Resolution</option>
                        </optgroup>
                        <optgroup label="Character Voices">
                            <option value="Professional and polished on the surface but with subtle cracks showing underneath. Corporate tone that occasionally breaks into genuine emotion.">🏢 Corporate Facade</option>
                            <option value="Speak like a detective narrating a case file. Analytical, observant, noting details that others missed. The truth slowly assembles itself.">🔍 Detective Narration</option>
                            <option value="Inner monologue style. Thoughtful, self-questioning. Argue with yourself. Second-guess, then find clarity. The audience hears the thinking process.">🧠 Inner Monologue</option>
                        </optgroup>
                    </select>
                </div>
                <div class="field">
                    <label>Custom Instructions</label>
                    <textarea id="inp-emotion" rows="3" placeholder="Write or edit emotion instructions…"></textarea>
                </div>
            </div>

            <!-- Pipeline -->
            <div class="card">
                <div class="card-title">Audio Pipeline</div>
                <div class="pipe-grid">
                    <div class="pipe-item">
                        <span>Silence Padding</span>
                        <div class="pipe-val">
                            <input type="number" id="inp-silence" min="0" max="5" step="0.1" value="0.8">
                            <span class="unit">s</span>
                        </div>
                    </div>
                    <div class="pipe-item">
                        <span>Normalize Volume</span>
                        <label class="switch">
                            <input type="checkbox" id="chk-norm" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="pipe-item">
                        <span>Export MP3</span>
                        <label class="switch">
                            <input type="checkbox" id="chk-mp3" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ FOOTER ═══ -->
    <footer id="footer">

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary" id="btn-gen">
                ▶&ensp;Generate
            </button>
            <button class="btn btn-danger hidden" id="btn-stop">
                ■&ensp;Stop
            </button>
            <button class="btn btn-ghost" id="btn-clear">🗑 Clear All</button>
            <div class="spacer"></div>
            <button class="btn btn-accent hidden" id="btn-dl-wav">⬇ WAV</button>
            <button class="btn btn-accent hidden" id="btn-dl-mp3">⬇ MP3</button>
        </div>

        <!-- Progress -->
        <div class="prog" id="prog">
            <div class="prog-bar-wrap">
                <div class="prog-bar" id="prog-bar"></div>
            </div>
            <div class="prog-info">
                <span id="prog-status">Ready</span>
                <span id="prog-detail" class="mono"></span>
            </div>
        </div>

        <!-- Chunk List -->
        <div class="chunk-list-wrap hidden" id="chunk-wrap">
            <div class="chunk-list-header">
                <span class="section-title">Chunks</span>
                <span id="chunk-summary" class="mono"></span>
            </div>
            <div class="chunk-list" id="chunk-list"></div>
        </div>

        <!-- Player -->
        <div class="player hidden" id="player">
            <button class="btn-play" id="btn-pp">▶</button>
            <div class="player-mid">
                <div class="player-label">
                    <span id="pl-title">Final Output</span>
                    <span id="pl-dur" class="mono">—</span>
                </div>
                <input type="range" class="timeline" id="pl-seek" min="0" max="100" value="0">
                <span id="pl-time" class="mono">0:00 / 0:00</span>
            </div>
        </div>

    </footer>

    <audio id="audio" preload="none"></audio>
    <audio id="audio-ref" preload="none"></audio>
    <script src="/static/app.js"></script>
</body>
</html>
