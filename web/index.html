<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrator — Production AI Voice Studio</title>
    <meta name="description" content="Local production-grade AI narration studio powered by Qwen3-TTS.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;450;500;650;750&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ═══ MAIN APPLICATION WORKSPACE ═══ -->
    <div id="app-layout">
        
        <!-- ── SIDEBAR CONTROL CONSOLE ── -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">🎙️</span>
                    <div class="brand-text">
                        <h1>Narrator</h1>
                        <span class="brand-subtext">AI Studio v3</span>
                    </div>
                </div>
                <div class="system-status" id="system-status">
                    <span class="status-dot"></span>
                    <span class="status-lbl">Standby</span>
                </div>
            </div>

            <div class="sidebar-scrollable-content">
                
                <!-- Card: Voice Preset -->
                <div class="sidebar-card">
                    <div class="card-headline">Voice Settings</div>
                    <div class="control-group">
                        <label for="select-voice">Active Narrator</label>
                        <select id="select-voice"></select>
                    </div>
                    <div class="control-group">
                        <label class="label-with-value">Speed <span id="lbl-speed">1.0x</span></label>
                        <input type="range" id="slider-speed" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>
                </div>

                <!-- Card: Reference voice -->
                <div class="sidebar-card">
                    <div class="card-headline">Voice Cloning</div>
                    <div class="control-group">
                        <label for="select-ref">Reference Profile</label>
                        <div class="select-row">
                            <select id="select-ref"></select>
                            <button class="btn btn-icon" id="btn-ref-play" title="Preview Reference Profile">▶</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label for="txt-ref-transcript">Reference Audio Transcript</label>
                        <textarea id="txt-ref-transcript" rows="2" placeholder="Exact spoken words..."></textarea>
                    </div>
                    <div class="upload-dropzone" id="drop-zone">
                        <input type="file" id="input-file-upload" accept=".wav,.mp3,.m4a,.flac" hidden>
                        <p>Drop WAV here or <span class="link-color" id="btn-browse-trigger">browse</span></p>
                    </div>
                </div>

                <!-- Card: Emotion Presets -->
                <div class="sidebar-card">
                    <div class="card-headline">Emotional Arc & Directions</div>
                    <div class="control-group">
                        <label for="select-emotion-preset">Narrator Presets</label>
                        <select id="select-emotion-preset">
                            <option value="">— Custom Prompts —</option>
                            <optgroup label="Narration Styles">
                                <option value="Deep, serious, and emotionally controlled. Speak slowly with gravitas and natural pauses. Begin calm and reflective, gradually build tension, express genuine hurt without melodrama, become intense during betrayal scenes, then finish with quiet confidence and emotional resolution.">🎭 Cinematic Narrator (Default)</option>
                                <option value="Warm, intimate, and conversational. Speak as if confiding in a close friend late at night. Natural pace with soft emphasis on emotional words. Gentle but honest.">💬 Intimate Confessional</option>
                                <option value="Cold, detached, and matter-of-fact. Deliver with clinical precision, no emotional coloring. The flatness itself conveys the weight of what happened.">🧊 Cold & Detached</option>
                            </optgroup>
                            <optgroup label="Betrayal & Deep Emotion">
                                <option value="Start calm and trusting, then let disbelief creep in. Build to a moment of stunned silence. Let the hurt land quietly, not loudly. End with a hollow, empty resolve.">💔 Betrayal Discovery</option>
                                <option value="Controlled anger simmering beneath every word. Speak with precision and restraint. Each sentence is measured, deliberate. The quietness is more terrifying than shouting.">🔥 Quiet Rage</option>
                                <option value="Vulnerable, raw, and exposed. Voice slightly unsteady. Pauses where words fail. Genuine emotional weight without melodrama. Let silence carry meaning.">😢 Raw Vulnerability</option>
                                <option value="Bitter and sardonic. Speak with a knowing smile. Every compliment is laced with irony. The humor is a shield against deeper pain.">😏 Bitter Sarcasm</option>
                                <option value="Resigned and exhausted. Speak as if you've already accepted the worst. No energy left for anger. Just a tired, hollow truth.">😶 Numb Resignation</option>
                            </optgroup>
                            <optgroup label="Pacing & Tension">
                                <option value="Slow, deliberate, and suspenseful. Long pauses between key phrases. Build tension with pacing alone. Let the listener lean in.">⏳ Slow Burn Suspense</option>
                                <option value="Urgent and intense. Words come faster as the stakes rise. Breathless at climactic moments. Sharp, punchy delivery.">⚡ Urgent & Intense</option>
                                <option value="Whispered and secretive. Speak as if someone might overhear. Intimate, conspiratorial. Pull the listener into a private confession.">🤫 Whispered Secret</option>
                                <option value="Nostalgic and wistful. Speak as if recalling a distant memory. Bittersweet warmth mixed with longing. Gentle, slightly faded.">🌅 Nostalgic Flashback</option>
                                <option value="Authoritative and confident. Speak with the certainty of someone who has survived. Strong, grounded, and empowered. The voice of hard-won wisdom.">👑 Empowered Resolution</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="txt-emotion-instructions">Tone Prompt</label>
                        <textarea id="txt-emotion-instructions" rows="3" placeholder="Acoustic prompt inputs..."></textarea>
                    </div>
                </div>

                <!-- Card: Audio Pipeline -->
                <div class="sidebar-card">
                    <div class="card-headline">Acoustic Engineering</div>
                    <div class="pipeline-stack">
                        <div class="pipeline-row">
                            <span class="pipeline-lbl">Silence Gap</span>
                            <div class="pipeline-val-input">
                                <input type="number" id="num-silence-padding" min="0" max="5" step="0.1" value="0.8">
                                <span class="unit">s</span>
                            </div>
                        </div>
                        <div class="pipeline-row">
                            <span class="pipeline-lbl">EBU R128 Normalize</span>
                            <label class="switch-capsule">
                                <input type="checkbox" id="check-normalize" checked>
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                        <div class="pipeline-row">
                            <span class="pipeline-lbl">MP3 Output</span>
                            <label class="switch-capsule">
                                <input type="checkbox" id="check-export-mp3" checked>
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- ── MAIN CONTENT WORKSPACE ── -->
        <main id="workspace">
            
            <!-- Editor Console Toolbar -->
            <div class="workspace-header">
                <div class="toolbar-brand">
                    <h2>Narrator Script Workspace</h2>
                    <span class="stats-badge" id="chunk-counter">0 Chunks</span>
                </div>
                <div class="toolbar-actions">
                    <span class="stats-text" id="word-counter">0 words</span>
                    <button class="btn btn-save" id="btn-save-script">💾 Save Changes</button>
                </div>
            </div>

            <!-- Workspace Textarea Frame -->
            <div class="editor-frame">
                <div class="editor-line-gutter" id="gutter"></div>
                <textarea id="script-textarea" spellcheck="false" 
                    placeholder="Begin writing your storytelling script here...&#10;&#10;Key Rules:&#10;- One line of text creates one output speech segment.&#10;- Paragraph breaks are skipped.&#10;- Customize narration presets inline:&#10;  [voice:serena] [emotion:Whispered, fearful] The shadow loomed closer.&#10;  [voice:aiden] [emotion:Quiet Rage] I walked away."></textarea>
            </div>

            <!-- Tag Injector Helper Shelf -->
            <div class="tag-shelf">
                <span class="shelf-label">Insert Tag:</span>
                <div class="shelf-tags">
                    <button class="tag-insert" data-tag="[voice:aiden]">Aiden (M)</button>
                    <button class="tag-insert" data-tag="[voice:serena]">Serena (F)</button>
                    <button class="tag-insert" data-tag="[voice:ryan]">Ryan (M)</button>
                    <button class="tag-insert" data-tag="[voice:vivian]">Vivian (F)</button>
                    <button class="tag-insert" data-tag="[emotion:Quiet Rage]">Quiet Rage</button>
                    <button class="tag-insert" data-tag="[emotion:Betrayal Discovery]">Betrayal</button>
                    <button class="tag-insert" data-tag="[emotion:Whispered]">Whisper</button>
                    <button class="tag-insert" data-tag="[emotion:Cold & Detached]">Detached</button>
                </div>
            </div>

            <!-- ── BOTTOM CONTROL CONSOLE & DRAWER ── -->
            <div class="bottom-console">
                
                <!-- Action Controls Panel -->
                <div class="console-actions">
                    <button class="btn btn-primary btn-generate" id="btn-action-generate">⚡ Run Generation</button>
                    <button class="btn btn-danger btn-stop hidden" id="btn-action-stop">🛑 Stop Pipeline</button>
                    <button class="btn btn-secondary btn-clear" id="btn-action-clear">🗑 Clear Output Files</button>
                    <div class="action-divider"></div>
                    <div class="download-pane">
                        <button class="btn btn-download hidden" id="btn-download-wav">WAV</button>
                        <button class="btn btn-download hidden" id="btn-download-mp3">MP3</button>
                    </div>
                </div>

                <!-- Pipeline Status Progress -->
                <div class="console-progress" id="status-overlay">
                    <div class="progress-track">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>
                    </div>
                    <div class="progress-info">
                        <span class="status-msg" id="status-msg">System Idle</span>
                        <span class="status-detail" id="status-stats"></span>
                    </div>
                </div>

                <!-- Collapsible Audio Segments Drawer -->
                <div class="segments-panel hidden" id="chunk-suite">
                    <div class="segments-header">
                        <h3>Segment History</h3>
                        <span id="chunk-stats-summary"></span>
                    </div>
                    <div class="segments-list" id="chunk-rows-container"></div>
                </div>

                <!-- Master Output Audio Player -->
                <div class="master-player hidden" id="audio-playback-player">
                    <button class="player-toggle-btn" id="btn-playback-toggle">▶</button>
                    <div class="player-body">
                        <div class="player-info">
                            <span id="playback-title">Full Output</span>
                            <span id="playback-duration">—</span>
                        </div>
                        <div class="player-seeker">
                            <input type="range" class="timeline-range" id="playback-range-input" min="0" max="100" value="0">
                            <span id="playback-time">0:00 / 0:00</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
        
    </div>

    <!-- Hidden Audio Nodes -->
    <audio id="audio-main-node" preload="none"></audio>
    <audio id="audio-ref-node" preload="none"></audio>

    <script src="/static/app.js"></script>
</body>
</html>
